# Worker that serves the dashboard out of R2. Deployed by hand, not by CI:
#
#   cd dashboard/worker
#   npx wrangler deploy
#
# Afterwards attach the custom domain in the Cloudflare dashboard
# (Workers & Pages -> sirens-bi -> Settings -> Domains & Routes) and put Access
# in front of it. CI never touches the Worker - it only syncs files into the
# bucket below.

name = "sirens-bi"
main = "index.js"
compatibility_date = "2026-08-01"

# Same bucket the dashboard workflow syncs the built site into. The jurisdiction
# is not decoration: a bucket created under one is invisible to a binding that
# omits it, exactly as it is invisible to the plain S3 endpoint. It is also
# fixed at creation time - changing it means making a new bucket.
[[r2_buckets]]
binding = "SITE"
bucket_name = "sirens-bi"
jurisdiction = "eu"
