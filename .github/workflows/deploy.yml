name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          APP_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/sirens' }}
        run: |
          set -euo pipefail
          test -n "$HOST" || { echo "DEPLOY_HOST secret is not set"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS secret is not set"; exit 1; }
          test -n "$SSH_KEY" || { echo "DEPLOY_SSH_KEY secret is not set"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          REMOTE_CMD="cd '$APP_PATH' && git remote set-url origin https://github.com/matthewjohnsobolev/sirens.git && git config http.version HTTP/1.1 && ./deploy/deploy.sh"

          ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes -o PubkeyAcceptedKeyTypes=+ssh-rsa "$USER@$HOST" "$REMOTE_CMD"

