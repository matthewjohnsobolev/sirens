<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{ error_code | default(404) }} | {{ (error_message | default('Сторінку не знайдено')) | lower }}</title>
<meta name="theme-color" content="#E9E9E7">

{% set ga_page_params = {'page_type': 'error', 'error_code': error_code | default(404) | string} %}
{% include "_analytics.html" %}
<script>
  // Биті посилання видно лише тут: page_view сам по собі не каже,
  // що сторінка була помилкою.
  window.track('error_page_view', {
    error_code: '{{ error_code | default(404) }}',
    error_referrer: document.referrer || '(none)'
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<style>
  :root{
    --bg:#E9E9E7;
    --fig:#D8D8D5;
    --hair:#CCCCC7;
    --copy:#68685F;
    --text:#65655D;
    --strong:#40403B;

    --s2:16px;
    --s4:32px;
    --s7:56px;

    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    display:grid;
    grid-template-rows:1fr auto;
    padding:clamp(24px,6vw,var(--s7));
    text-align:center;
  }
  main{
    display:grid;
    place-items:center;
    padding-bottom:7vh;
  }
  .num{
    font-size:clamp(96px,20vw,180px);
    font-weight:700;color:var(--fig);
    line-height:1;letter-spacing:.01em;margin:0;
  }
  .msg{
    margin:var(--s4) 0 0;
    font-size:12.5px;font-weight:400;color:var(--text);
    letter-spacing:.18em;text-transform:uppercase;
    margin-right:-.18em;
  }
  .back{
    display:inline-block;margin-top:var(--s4);
    font-size:11.5px;font-weight:500;color:var(--strong);
    letter-spacing:.14em;text-transform:uppercase;
    text-decoration:none;
    border-bottom:1px solid var(--hair);
    padding-bottom:6px;
    margin-right:-.14em;
  }
  .back:hover{border-color:var(--strong)}
  .back:focus-visible{outline:2px solid var(--strong);outline-offset:4px;border-radius:2px}
  .copy{
    margin:0 -.14em 0 0;
    font-size:10.5px;font-weight:400;color:var(--copy);
    letter-spacing:.14em;text-transform:uppercase;
  }

  @media (max-width:600px){
    main{padding-bottom:5vh}
    .msg{letter-spacing:.12em;font-size:11.5px;margin-top:var(--s2);margin-right:-.12em}
    .back{letter-spacing:.12em;margin-top:var(--s4);margin-right:-.12em}
    .copy{letter-spacing:.1em;margin-right:-.1em}
  }
</style>
</head>
<body>
  <main>
    <div>
      <p class="num">{{ error_code | default(404) }}</p>
      <p class="msg">{{ error_message | default('Сторінку не знайдено') }}</p>
      <a class="back" href="/">На головну</a>
    </div>
  </main>

  <p class="copy">© 2026 «Сирени»</p>
</body>
</html>
