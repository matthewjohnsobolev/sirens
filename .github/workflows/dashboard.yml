name: dashboard

# Builds the Evidence dashboard and syncs it into R2, where the sirens-bi Worker
# serves it from. Not Cloudflare Pages: Pages rejects files over 25 MiB and
# Evidence ships a 32.7 MiB duckdb-eh.wasm.
#
# The data never leaves the server over a database connection: this job simply
# downloads the CSV the web service exports, so nothing here needs access to
# Postgres. Runs after the daily snapshot (09:00 Kyiv) has had time to finish.
#
# Required secrets: STATS_EXPORT_TOKEN (same value as in the server's .env),
#   CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   (the R2 pair comes from R2 -> API -> Manage API tokens, not the global token)
# Optional variables: STATS_URL (default https://sirens.live/bi/stats.csv),
#   R2_BUCKET (default sirens-bi)

on:
  schedule:
    - cron: "30 7 * * *"   # UTC
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Download subscriber history
        env:
          STATS_TOKEN: ${{ secrets.STATS_EXPORT_TOKEN }}
          STATS_URL: ${{ vars.STATS_URL || 'https://sirens.live/bi/stats.csv' }}
        run: |
          set -euo pipefail
          test -n "$STATS_TOKEN" || { echo "STATS_EXPORT_TOKEN secret is not set"; exit 1; }
          # -f so an error page never gets published as if it were data.
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -H "X-Stats-Token: $STATS_TOKEN" \
            -o sources/sirens/channel_stats.csv \
            "$STATS_URL"
          echo "Downloaded $(wc -l < sources/sirens/channel_stats.csv) rows"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: |
          npm run sources
          npm run build

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET || 'sirens-bi' }}
          # sirens-bi was created in the EU jurisdiction, which is served from
          # its own S3 host - the plain one answers NoSuchBucket. A bucket in the
          # default jurisdiction drops the ".eu"; set the R2_ENDPOINT repository
          # variable to override. Jurisdiction cannot be changed after creation.
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || format('https://{0}.eu.r2.cloudflarestorage.com', secrets.CLOUDFLARE_ACCOUNT_ID) }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "R2_ACCESS_KEY_ID secret is not set"; exit 1; }
          test -n "${ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }

          # Fail with the actual reason rather than sync's "fatal error" wall of
          # text: a bad key, a missing bucket and the wrong jurisdiction all
          # surface here as one clear line.
          aws s3 ls "s3://${BUCKET}" --endpoint-url "$R2_ENDPOINT" >/dev/null \
            || { echo "Cannot read bucket '${BUCKET}' at ${R2_ENDPOINT}. Check that R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY are the S3 pair (not the R2 token value) with Object Read & Write, that CLOUDFLARE_ACCOUNT_ID matches, and that the endpoint jurisdiction matches the bucket's."; exit 1; }

          # --delete keeps the bucket a mirror of the build: Evidence renames
          # content-hashed assets every release, so without it the bucket only
          # ever grows. Content types are not set here on purpose - the Worker
          # derives them from the extension, which is the one place that can get
          # .wasm right regardless of what the uploader guessed.
          aws s3 sync build "s3://${BUCKET}" --endpoint-url "$R2_ENDPOINT" \
            --delete --no-progress
