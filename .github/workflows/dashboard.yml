name: dashboard

# Builds the Evidence dashboard and syncs it into R2, where the sirens-bi Worker
# serves it from. It downloads the consolidated raw CSV directly from R2,
# so nothing here needs access to the server or Postgres. See "Channel Statistics"
# in README.md for the setup this expects.
#
# Required secrets: CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Optional variables: R2_BUCKET (default sirens-bi), R2_ENDPOINT

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Download subscriber history from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATA_BUCKET: ${{ vars.CLOUDFLARE_R2_BI_DATA_BUCKET || vars.CLOUDFLARE_R2_DATA_BUCKET || vars.R2_DATA_BUCKET || vars.CLOUDFLARE_R2_BUCKET || vars.R2_BUCKET || 'sirens-bi-data' }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || vars.R2_ENDPOINT || format('https://{0}.r2.cloudflarestorage.com', secrets.CLOUDFLARE_ACCOUNT_ID) }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "R2_ACCESS_KEY_ID or CLOUDFLARE_R2_ACCESS_KEY_ID secret is not set"; exit 1; }
          test -n "${ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }

          # Check access to data bucket
          aws s3 ls "s3://${DATA_BUCKET}" --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null \
            || { echo "Cannot access data bucket '${DATA_BUCKET}' at ${R2_ENDPOINT}. Check that your API token is the S3 Access Key ID/Secret (not the R2 token value) with Object Read & Write permissions."; exit 1; }

          # Check if subscribers.csv exists
          aws s3 ls "s3://${DATA_BUCKET}/subscribers.csv" --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null \
            || { echo "subscribers.csv not found in s3://${DATA_BUCKET}/. Run the BI worker on the server first to generate the initial snapshot."; exit 1; }

          mkdir -p sources/sirens
          aws s3 cp "s3://${DATA_BUCKET}/subscribers.csv" sources/sirens/subscribers.csv \
            --endpoint-url "$R2_ENDPOINT" --region auto

          rows=$(( $(wc -l < sources/sirens/subscribers.csv) - 1 ))
          test "$rows" -gt 0 || { echo "stats export returned no data rows"; exit 1; }
          echo "Downloaded $rows rows"

      - name: Install dependencies
        run: npm install --no-audit --no-fund


      - name: Build
        run: |
          npm run sources
          npm run build

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_BUCKET: ${{ vars.CLOUDFLARE_R2_BI_WEB_BUCKET || vars.CLOUDFLARE_R2_WEB_BUCKET || vars.R2_WEB_BUCKET || vars.CLOUDFLARE_R2_BUCKET || vars.R2_BUCKET || 'sirens-bi-web' }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || vars.R2_ENDPOINT || format('https://{0}.r2.cloudflarestorage.com', secrets.CLOUDFLARE_ACCOUNT_ID) }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "R2_ACCESS_KEY_ID or CLOUDFLARE_R2_ACCESS_KEY_ID secret is not set"; exit 1; }
          test -n "${ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }

          aws s3 ls "s3://${WEB_BUCKET}" --endpoint-url "$R2_ENDPOINT" --region auto >/dev/null \
            || { echo "Cannot read bucket '${WEB_BUCKET}' at ${R2_ENDPOINT}. Check that R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY are the S3 pair with Object Read & Write, and that the endpoint matches."; exit 1; }

          # Publish compiled site to web bucket
          aws s3 sync build "s3://${WEB_BUCKET}" --endpoint-url "$R2_ENDPOINT" --region auto \
            --delete --no-progress




