        <h1 class="sr-only">Де зараз повітряна тривога в Україні</h1>
        <div id='map'></div>

        <script>

        var zoomLevel = 6;
        if( /Android|iPhone/i.test(navigator.userAgent) ) {
            zoomLevel = 5;
        }

        const map = L.map('map', {
            zoomControl: false,
            wheelPxPerZoomLevel: 120,
            wheelDebounceTime: 60
        });
        map.setView([48.3794, 31.1656], zoomLevel);

        // Кнопки й плашку стану збирає map-ui.js: він виконується після
        // цього блока, тож мапа має бути доступна йому за іменем.
        window.sirensMap = map;

        // Окрема панель для підписів над полігонами областей.
        // За замовчуванням Leaflet має:
        // tilePane: z-index 200 (підкладка мапи: земля, вода, дороги)
        // overlayPane: z-index 400 (полігони областей GeoJSON та штрихування тривог)
        // labelsPane: z-index 450 (підписи міст поверх полігонів)
        // markerPane: z-index 600 (іконки каналів і загроз над підписами)
        // popupPane: z-index 700 (картки інформації)
        map.createPane('labelsPane');
        const labelsPane = map.getPane('labelsPane');
        labelsPane.style.zIndex = '450';
        labelsPane.style.pointerEvents = 'none';

        // Підкладка векторна, і причина одна: підписи мають бути українськими.
        // У растровому тайлі текст запечений у картинку — «Kharkiv» там не
        // перекласти нічим. У векторному підпис малює браузер, тож мова стає
        // властивістю стилю: беремо name:uk, якщо він є в даних OSM.
        //
        // Ціна рішення — MapLibre GL (близько 250 КБ стисненого JS) і WebGL.
        // Тому нижче лишається растровий запасний шлях: мапа тривог мусить
        // відкриватися й на телефоні, який WebGL не вміє.
        const CARTO_STYLE = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';
        // Кредит самої мапи ставимо руками й одразу: він потрібен обом
        // підкладкам. Ліцензійний рядок джерела дописує сама підкладка —
        // векторна бере його з tiles.json, растрова має його в опції нижче.
        // Так кредит завжди відповідає тому, що реально намальовано.
        map.attributionControl.addAttribution("<img src='{{  url_for('static', filename='img/favicon.svg')  }}' alt='' class='map-attribution-logo' width='12' height='12'/> <a href='https://www.sirens.live/'>Sirens</a>");

        // Порядок джерел назви: українська → місцева → англійська. Перше дає
        // Харків замість Kharkiv, друге рятує дрібні села, яким ніхто не
        // проставив name:uk, третє — латиницю там, де немає й місцевої.
        const NAME_UK = ['coalesce', ['get', 'name:uk'], ['get', 'name'], ['get', 'name_en']];

        // Шари з підписами країн, континентів та адміністративних областей/штатів.
        // На мапі тривог вони створюють візуальний шум і перекривають міста.
        const HIDDEN_PLACE_LAYERS = new Set([
            'place_country_1',
            'place_country_2',
            'place_continent',
            'place_state'
        ]);

        // Стиль CARTO нижче z13 підписує все англійською (name_en), і саме це
        // ми й перебиваємо. Чіпаємо тільки ті шари, що підписують назви:
        // номери будинків і номери доріг перекладати нема чого.
        function localizeNames(style) {
            style.layers = style.layers.filter(layer => !HIDDEN_PLACE_LAYERS.has(layer.id));
            for (const layer of style.layers) {
                const field = layer.layout && layer.layout['text-field'];
                if (field && JSON.stringify(field).includes('name')) {
                    layer.layout['text-field'] = NAME_UK;

                    // Чіткі підписи міст і селищ над заливкою тривог:
                    // темний графітовий колір і чітке біле гало товщиною 2px
                    if (!layer.paint) layer.paint = {};
                    layer.paint['text-color'] = '#16181A';
                    layer.paint['text-halo-color'] = '#FFFFFF';
                    layer.paint['text-halo-width'] = 2.0;
                }
            }
            return style;
        }

        function webglWorks() {
            try {
                const probe = document.createElement('canvas');
                return !!(window.WebGLRenderingContext &&
                          (probe.getContext('webgl') || probe.getContext('experimental-webgl')));
            } catch (error) {
                return false;
            }
        }

        // Запасна підкладка: растровий OSM, як було до вектора. Гірші підписи —
        // краще, ніж порожній екран там, де тривога.
        function addRasterFallback() {
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>",
                maxZoom: 19,
                minZoom: 0,
            }).addTo(map);
        }

        if (webglWorks()) {
            fetch(CARTO_STYLE)
                .then(response => {
                    if (!response.ok) throw new Error('style ' + response.status);
                    return response.json();
                })
                .then(style => {
                    // Розділяємо підкладку на геометрію (земля, вода, дороги) під
                    // полігонами областей та підписи (міста, річки) поверх полігонів.
                    // Так заливка тривоги не закриває назви міст.
                    const baseStyle = Object.assign({}, style, {
                        layers: style.layers.filter(layer => layer.type !== 'symbol')
                    });

                    const labelsStyle = localizeNames(Object.assign({}, style, {
                        layers: style.layers.filter(layer => layer.type === 'symbol')
                    }));

                    L.maplibreGL({ style: baseStyle, pane: 'tilePane' }).addTo(map);
                    L.maplibreGL({
                        style: labelsStyle,
                        pane: 'labelsPane',
                        attributionControl: false
                    }).addTo(map);
                })
                .catch(error => {
                    console.error('Basemap style failed, falling back to raster:', error);
                    addRasterFallback();
                });
        } else {
            addRasterFallback();
        }

        var guidedBombIcon = L.icon({

        var cityIcon = L.icon({

        var airfieldIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/airfield-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var portIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/port-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var waterIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/water-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        function createMarker(lat, lng, icon, popupContent) {
            const marker = L.marker([lat, lng], {icon: icon})
                .bindPopup(popupContent)
                .addTo(map);

            return marker;
        }

        function updateMarker(marker, isActive) {
            if (!isActive) {
                marker.remove();
            }
        }

        </script>
