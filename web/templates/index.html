        <!-- Twitter Meta Tags -->

        <meta name="twitter:image" content="https://sirens.live/static/img/og-banner.png">

        <link rel="preconnect" href="https://unpkg.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
        <link rel="manifest" href="{{ static_url('manifest.webmanifest') }}">

        <link rel="stylesheet" href="{{ static_url('css/tokens.css') }}">
        <link rel="stylesheet" href="{{ static_url('css/main.css') }}">
        <link rel="stylesheet" href="{{ static_url('css/map-ui.css') }}">
        <link rel="stylesheet" href="{{ static_url('css/mobile.css') }}">
        <link rel="stylesheet" href="{{ static_url('css/oblasts.css') }}">
        <link rel="stylesheet" href="{{ static_url('css/channels.css') }}">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="{{ static_url('js/districts.js') }}" type="text/javascript"></script>
        <script src="{{ static_url('js/cities.js') }}" type="text/javascript"></script>

        <script src="{{ static_url('js/map-ui.js') }}" defer></script>
        <script src="{{ static_url('js/analytics.js') }}" defer></script>

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": "{{ site_url }}/#organization",
              "name": "Сирени",
              "url": "{{ site_url }}/",
              "logo": "{{ site_url }}/static/img/logo.svg"
            },
            {
              "@type": "WebSite",
              "@id": "{{ site_url }}/#website",
              "name": "Сирени",
              "url": "{{ site_url }}/",
              "inLanguage": "uk-UA",
              "publisher": {"@id": "{{ site_url }}/#organization"}
            },
            {
              "@type": "WebApplication",
              "name": "Сирени — мапа повітряних тривог України",
              "url": "{{ site_url }}/",
              "applicationCategory": "https://schema.org/UtilitiesApplication",
              "operatingSystem": "Any",
              "browserRequirements": "JavaScript",
              "inLanguage": "uk-UA",
              "isAccessibleForFree": true,
              "offers": {"@type": "Offer", "price": "0", "priceCurrency": "UAH"},
              "publisher": {"@id": "{{ site_url }}/#organization"}
            }
          ]
        }
        </script>
    </head>
    <body>
        <h1 class="sr-only">Де зараз повітряна тривога в Україні</h1>
        <div id='map'></div>

        <script>

        var zoomLevel = 6;
        if( /Android|iPhone/i.test(navigator.userAgent) ) {
            zoomLevel = 5;
        }

        const map = L.map('map', {zoomControl: false})
        map.setView([48.3794, 31.1656], zoomLevel);

        // Кнопки й плашку стану збирає map-ui.js: він виконується після
        // цього блока, тож мапа має бути доступна йому за іменем.
        window.sirensMap = map;

        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: "<img src='{{  url_for('static', filename='img/favicon.ico')  }}' alt='Sirens' style='vertical-align: middle; height: 13px;'/> <a href='http://www.sirens.live/'>Sirens</a> | &copy; <a href='http://www.openstreetmap.org/copyright'>OpenStreetMap</a>",
            maxZoom: 20,
            minZoom: 0,
        }).addTo(map);

        var greenChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/air-raid-alert-cancelled-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14],
        });

        var orangeChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/air-raid-alert-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var redChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/channel-red.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var yellowChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/channel-yellow.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var purpleChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/channel-purple.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var missileIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/missile-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var reconDroneIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/recon-drone-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var kamikazeDroneIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/kamikaze-drone-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var guidedBombIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/guided-bomb-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var cityIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/city-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var airfieldIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/airfield-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var portIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/port-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var waterIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/water-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        function createMarker(lat, lng, icon, popupContent) {
            const marker = L.marker([lat, lng], {icon: icon})
                .bindPopup(popupContent)
                .addTo(map);

            return marker;
        }

        function updateMarker(marker, isActive) {
            if (!isActive) {
                marker.remove();
            }
        }

        </script>
    </body>
</html>
