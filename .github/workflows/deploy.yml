name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          APP_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/sirens' }}
        run: |
          set -euo pipefail
          test -n "$HOST" || { echo "DEPLOY_HOST secret is not set"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS secret is not set"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          REMOTE_CMD="cd '$APP_PATH' && (git config http.version HTTP/1.1 2>/dev/null || true) && ./deploy/deploy.sh"

          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" "$REMOTE_CMD"
          else
            test -n "${SSHPASS:-}" || { echo "Set DEPLOY_PASSWORD or DEPLOY_SSH_KEY"; exit 1; }
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            # sshpass reads $SSHPASS itself, so the password never lands in argv.
            sshpass -e ssh -p "$PORT" \
              -o PreferredAuthentications=password,keyboard-interactive \
              -o PubkeyAuthentication=no \
              "$USER@$HOST" "$REMOTE_CMD"
          fi
