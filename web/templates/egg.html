<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Egg</title>
    <link rel="shortcut icon" href="{{ static_url('img/favicon.ico') }}">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .egg-image {
            max-width: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <img class="egg-image" src="{{ static_url('img/egg.png') }}" alt="Egg">
</body>
</html>
