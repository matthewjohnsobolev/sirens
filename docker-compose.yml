services:
  db:
    image: postgres:15-alpine
    container_name: sirens-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env - see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-sirens}
      TZ: Europe/Kyiv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sirens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sirens-redis
    restart: always
    environment:
      TZ: Europe/Kyiv
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sirens-web
    restart: always
    ports:
      - "127.0.0.1:8000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sirens}
      - TZ=Europe/Kyiv
    env_file:
      - .env
    # --timeout: a worker stuck on a dependency is recycled instead of holding
    # a request forever. --max-requests recycles workers on a slow schedule so
    # a leak in a long-lived process cannot accumulate unnoticed.
    command: >-
      gunicorn --workers 3 --bind 0.0.0.0:5000
      --timeout 30 --graceful-timeout 30
      --max-requests 2000 --max-requests-jitter 200
      web.server:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  alerts:
    build: .
    container_name: sirens-alerts
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sirens}
      - TZ=Europe/Kyiv
    env_file:
      - .env
    stdin_open: true
    tty: true
    command: python run_alerts.py -m ${APP_ENV:-dev}

  bi:
    build: .
    container_name: sirens-bi
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sirens}
      - TZ=Europe/Kyiv
    env_file:
      - .env
    stdin_open: true
    tty: true
    command: python run_bi.py -m ${APP_ENV:-dev}

volumes:
  pgdata:
  redisdata:
