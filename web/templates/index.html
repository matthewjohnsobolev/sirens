        <div id='map'></div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
        <script>

        const mapSize = document.querySelector("#map");
        
        const hideMarkersButton = document.createElement("div");
        hideMarkersButton.classList.add("layer-control");
        mapSize.appendChild(hideMarkersButton);
        hideMarkersButton.setAttribute("title", "Прибрати маркери");

        const hideMarkersIcon = document.createElement("img");
        hideMarkersIcon.src = "{{ url_for('static', filename='img/icons/markers-off-button-icon.svg') }}";
        hideMarkersIcon.classList.add("layer-control-icon");
        hideMarkersButton.appendChild(hideMarkersIcon);

        hideMarkersButton.addEventListener('click', function() {
            if (hideMarkersIcon.getAttribute('src') === "{{ url_for('static', filename='img/icons/markers-off-button-icon.svg') }}") {
                hideMarkersIcon.setAttribute('src', "{{ url_for('static', filename='img/icons/markers-on-button-icon.svg') }}");
                hideMarkersButton.setAttribute("title", "Показати маркери");

                map.getPane('markerPane').style.display = 'none';
                map.getPane('shadowPane').style.display = 'none';
                map.closePopup();
            } else {
                hideMarkersIcon.setAttribute('src', "{{ url_for('static', filename='img/icons/markers-off-button-icon.svg') }}");
                hideMarkersButton.setAttribute("title", "Прибрати маркери");
                
                map.getPane('markerPane').style.display = '';
                map.getPane('shadowPane').style.display = '';
            }
        });

        const reportErrorButton = document.createElement("a");
        reportErrorButton.classList.add("contact-button");
        reportErrorButton.href = "/issue";
        reportErrorButton.setAttribute("title", "Повідомити про збій");
        mapSize.appendChild(reportErrorButton);

        const reportErrorIcon = document.createElement("img");
        reportErrorIcon.src = "{{ url_for('static', filename='img/icons/contact-us-button-icon.svg') }}";
        reportErrorIcon.classList.add("contact-icon");
        reportErrorButton.appendChild(reportErrorIcon);

        function closeBanner() {
            document.getElementById('banner').classList.add('closed');
            document.getElementById('map').classList.add('full-height');
            setTimeout(function() {
                window.dispatchEvent(new Event('resize'));
            }, 300);
        }

        var zoomLevel = 6; 
        if( /Android|iPhone/i.test(navigator.userAgent) ) {
            zoomLevel = 5;
        }

        const map = L.map('map', {zoomControl: false}) 
        map.setView([48.3794, 31.1656], zoomLevel);
        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: "<img src='{{  url_for('static', filename='img/favicon.ico')  }}' alt='Sirens' style='vertical-align: middle; height: 13px;'/> <a href='http://www.sirens.live/'>Sirens</a> | &copy; <a href='http://www.openstreetmap.org/copyright'>OpenStreetMap</a>",
            maxZoom: 20,
            minZoom: 0,
        }).addTo(map);

        new L.control.zoom({
            position: 'topleft',
            zoomInTitle: "Наблизити",
            zoomOutTitle: "Віддалити"
        }).addTo(map);

        var greenChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/air-raid-alert-cancelled-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14],
        });

        var orangeChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/air-raid-alert-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var redChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/channel-red.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var yellowChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/channel-yellow.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var purpleChannelIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/channel-purple.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var missileIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/missile-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var reconDroneIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/recon-drone-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var kamikazeDroneIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/kamikaze-drone-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var guidedBombIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/guided-bomb-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var cityIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/city-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var airfieldIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/airfield-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var portIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/port-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        var waterIcon = L.icon({
            iconUrl: "{{ url_for('static', filename='img/icons/water-marker.svg') }}",
            iconSize: [27.5, 27.5],
            popupAnchor: [0, -14]
        });

        function createMarker(lat, lng, icon, popupContent) {
            const marker = L.marker([lat, lng], {icon: icon})
                .bindPopup(popupContent)
                .addTo(map);
            
            return marker;
        }

        function updateMarker(marker, isActive) {
            if (!isActive) {
                marker.remove();
            }
        }

        </script>
