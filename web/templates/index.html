    <body>
        <h1 class="sr-only">Де зараз повітряна тривога в Україні</h1>
        <div id='map'></div>

        <script>

        var zoomLevel = 6;
        if( /Android|iPhone/i.test(navigator.userAgent) ) {
            zoomLevel = 5;
        }

        const map = L.map('map', {
            zoomControl: false,
            wheelPxPerZoomLevel: 120,
            wheelDebounceTime: 60
        });
        map.setView([48.3794, 31.1656], zoomLevel);

        // Кнопки й плашку стану збирає map-ui.js: він виконується після
        // цього блока, тож мапа має бути доступна йому за іменем.
        window.sirensMap = map;

        /* Підкладка — растрові тайли. Векторну тут тримали заради
           українських підписів: у растровому тайлі текст запечений у
           картинку, і «Kharkiv» там не перекласти нічим. Тепер підписів у
           підкладки немає взагалі — їх малює сама мапа своїм шрифтом, — і
           разом із ними відпала єдина причина везти на сторінку MapLibre
           GL (близько 250 КБ стисненого JS) і вимагати WebGL. Растр
           віддає ту саму Positron готовими картинками.

           Джерело й кредит приходять з конфігурації: провайдера міняють у
           .env, не чіпаючи шаблон. Обидва значення йдуть через tojson —
           це вставка в JS, а не в розмітку, і рядок має приїхати рівно
           таким, яким його написали, з лапками й екрануванням від
           браузера, а не від Jinja. */
        L.tileLayer({{ map_tiles_url | tojson }}, {
            attribution: {{ map_tiles_attribution | tojson }},
            maxZoom: 19,
            minZoom: 0,
            subdomains: 'abcd'
        }).addTo(map);

        // Кредит самого сервісу ставимо поруч із кредитом підкладки:
        // перший про те, хто зібрав тривоги, другий — хто намалював землю.
        map.attributionControl.addAttribution("<img src='{{  url_for('static', filename='img/favicon.svg')  }}' alt='' class='map-attribution-logo' width='12' height='12'/> <a href='https://www.sirens.live/'>Sirens</a>");

        </script>
    </body>
